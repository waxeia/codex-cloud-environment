name: Build Mimi Note Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "build/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/small-sticky-release.yml"

permissions:
  contents: write

concurrency:
  group: mimi-note-release
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mimi-note-v1.0.1
          name: 咪咪便签 v1.0.1
          body: |
            Linux x86_64 桌面便签。Ubuntu 推荐下载 DEB 安装；也可下载 AppImage 直接运行。
          files: |
            dist/*.AppImage
            dist/*.deb
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
